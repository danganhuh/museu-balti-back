services:
  - type: web
    name: museu-balti-api
    runtime: node
    buildCommand: npm ci --include=dev && npm ci --include=dev --prefix server && npm run build:render
    startCommand: node server/dist/index.js
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_EXPIRES_IN
        value: 2m
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_SECRET
        sync: false
      - key: ADMIN_EMAIL
        sync: false
